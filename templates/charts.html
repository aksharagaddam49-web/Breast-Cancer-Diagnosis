 <html>

                <head>
				<center><h1>Dataset Class Distribution Chart</h1></center>
                  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
                  <script type="text/javascript">
                    google.charts.load("current", {packages:["corechart"]});
                    google.charts.setOnLoadCallback(drawChart);
                    function drawChart() {
                      var data = google.visualization.arrayToDataTable([
                        ['class', 'percentage'],
                        ['Benign ',     70],
                       
                        ['Malignant',    30]
                      ]);
              
                      var options = {
                        title: '',
                        is3D: true,
                      };
              
                      var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
                      chart.draw(data, options);
                    }
                    
                  </script>
                </head>
                <body>
                  
                 
                  <center><div id="piechart_3d" style="width: 900px; height: 500px; "></div></center>
                   <h1><center>Model Accuracy Chart</center></h1>
						 <div id = "container" style = "width: 750px; height: 400px; margin: 0 auto">
						 </div>
						 <script language = "JavaScript">
							function drawChart() {
							   // Define the chart to be drawn.
							   var data = google.visualization.arrayToDataTable([
								  ['Model', 'Train Accuracy','Test Accuracy'],
								  [' DenseNet201', 98,88]
								  
							   ]);
				   
							   var options = {title: 'accuracy_score'}; 
				   
							   // Instantiate and draw the chart.
							   var chart = new google.visualization.BarChart(document.getElementById('container'));
							   chart.draw(data, options);
							}
							google.charts.setOnLoadCallback(drawChart);
						 </script>
                </body>
