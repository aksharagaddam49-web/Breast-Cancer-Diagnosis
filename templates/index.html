		<html lang="en">
		<head>
			<meta charset="UTF-8">

			<title>Image Upload</title>
			<style>
				body {
					font-family: Arial, sans-serif;
					margin: 0;
					padding: 0;
					background-color: #f4f4f4;
				}
		
				.section-header h2 {
					text-align: center;
					margin-top: 40px;
					font-size: 24px;
					color: #333;
				}
		
				 
		
				.navbar-header {
					text-align: center;
				}
		
			 
		
				.container-login100 {
					background-size: cover;
					background-position: center;
					width: 100%;
					height: 50%;
					display: flex;
					justify-content: center;
					align-items: flex-start; /* Changed to flex-start */
				}
		
				.wrap-login100 {
					background: rgba(255, 255, 255, 0.9);
					padding: 40px;
					border-radius: 10px;
					box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
					text-align: center;
					margin-top: 20px; /* Added margin to move the form down */
				}
		
				.login100-form-title {
					font-size: 24px;
					color: #333;
					margin-bottom: 20px;
				}
		
				.login100-form-title-1 {
					font-size: 28px;
					font-weight: bold;
					color: #333;
				}
		
				.wrap-input100 {
					margin-bottom: 20px;
				}
		
				.input100 {
					width: 100%;
					padding: 10px;
					border: 1px solid #ccc;
					border-radius: 5px;
					font-size: 16px;
				}
		
				.container-login100-form-btn {
					margin-top: 20px;
				}
		
				.btn {
					padding: 10px 20px;
					background-color: #007bff;
					color: white;
					border: none;
					border-radius: 5px;
					cursor: pointer;
					font-size: 16px;
				}
		
				.btn:hover {
					background-color: #0056b3;
				}
		
				#preview {
					max-width: 100%;
					height: auto;
					margin-top: 20px;
					border-radius: 5px;
				}
		
				select {
					padding: 10px;
					border: 1px solid #ccc;
					border-radius: 5px;
					font-size: 16px;
				}
		
				label {
					font-size: 16px;
					color: #333;
				}
			</style>
		</head>
		<body>
			<div class="section-header">
				
				 
			</div>
			<nav class="root navbar navbar-default navbar-fixed-top">
				<div class="container-fluid row">
					<div class="navbar-header col-md-1 col-sm-1"></div>
				</div>
			</nav>
		
			<div class="limiter">
				<div class="container-login100" style="background-image: url(../static/images/background1.jpg);">
					<div class="wrap-login100">
						<div class="login100-form-title" style="background-image: url(../static/images/background2.jpg);">
							<span class="login100-form-title-1">Upload Mammogram Image:</span>
						</div>
						<br><br>
						<form class="login100-form validate-form" action="/submit" method="POST" enctype="multipart/form-data">
							<div class="wrap-input100 validate-input m-b-26" data-validate="Username is required">
								<br>
								<input class="input100" type="file" name="my_image" id="imagefile" class="btn" accept="image/*" onchange="previewImage();" required>
							</div>
							<img id="preview">
							<div class="container-login100-form-btn">
								<br><br>
								<center>
									<label><b>Select the Model:</b></label>
									<select name="model" width="190" style="width: 190px">
										<option name="model" value="Xception">Xception Model</option>
										<option name="model" value="MobileNet">MobileNet Model</option>
									</select>
								</center>
								<br><br>
								<button class="btn btn-primary" type="submit">Submit</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		
			<script>
				function previewImage() {
					var preview = document.querySelector('#preview');
					var file = document.querySelector('input[type=file]').files[0];
					var reader = new FileReader();
		
					reader.onloadend = function () {
						preview.src = reader.result;
					}
		
					if (file) {
						reader.readAsDataURL(file);
					} else {
						preview.src = "";
					}
				}
			</script>
		</body>
